name: Release

# An annotated tag v0.1.0 publishes to PyPI; v0.1.0-rc1 publishes to TestPyPI.
# Both need the tag to equal the version in pyproject.toml, and both wait for an approval
# in their environment ("pypi" / "testpypi"), where the trusted publisher is configured.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.kind.outputs.candidate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: the tag is the version in pyproject.toml, and the changelog has its section
        # Written outside the checkout: the source distribution takes every *.md beside pyproject.toml.
        run: uv run --no-project python tools/release.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - id: kind
        run: |
          case "$GITHUB_REF_NAME" in
            *rc*) echo "candidate=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "candidate=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check --strict dist/*
      - name: the wheel installs and runs in a clean environment
        run: |
          uv venv --no-project /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/vispek-hc --version
          /tmp/clean/bin/vispek-hc check --simulate --json
          cd "$RUNNER_TEMP" && /tmp/clean/bin/vispek-hc demo -o demo --json
      - run: cp "$RUNNER_TEMP/notes.md" notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the trusted publisher and must require a reviewer: see
    # docs/release-checklist.md. An environment that does not exist yet is created
    # without protection, so set both up before the first tag.
    environment: ${{ needs.build.outputs.candidate == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write # trusted publishing, attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Attestations of a private repository need a paid plan; the repository is public
      # by the time a real release is made.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish to TestPyPI
        if: ${{ needs.build.outputs.candidate == 'true' }}
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ dist/*
      - name: publish to PyPI
        if: ${{ needs.build.outputs.candidate != 'true' }}
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub release, and nothing else in this job
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.candidate == 'true' && '--prerelease' || '' }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $PRERELEASE
